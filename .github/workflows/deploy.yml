name: Test and publish live Thread site
run-name: "Publish live site #${{ github.run_number }} (${{ github.event_name == 'workflow_dispatch' && 'manual request' || 'main updated' }})"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check TypeScript and build the app
        run: npm run build
      - name: Install browser test tools
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the tested site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to the existing Thread link
        id: deployment
        uses: actions/deploy-pages@v4
